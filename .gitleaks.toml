# LC-2113 gitleaks config: default rules + EasyMerchant / lyfePAY specific credential shapes.
[extend]
useDefault = true

[[rules]]
id = "em-api-key-secret-header"
description = "em-api x-apikey / x-apisecret value hard-coded"
regex = '''(?i)["']?x-?api-?(?:key|secret)["']?\s*[:=,]\s*["'`]([A-Za-z0-9]{12,})["'`]'''
secretGroup = 1

[[rules]]
id = "em-api-php-key-secret"
description = "em-api $api_key / $secret_key hard-coded in PHP"
regex = '''\$(?:api_key|secret_key|api_secret)\s*=\s*["']([A-Za-z0-9]{12,})["']'''
secretGroup = 1

[[rules]]
id = "laravel-sanctum-token"
description = "Laravel Sanctum personal access token (id|secret)"
regex = '''(?:^|[^A-Za-z0-9])([0-9]{1,8}\s?\|\s?[A-Za-z0-9]{40,})'''
secretGroup = 1

[allowlist]
description = "Redacted placeholders used in LC-2113 audit docs"
regexes = ['''REDACTED LC-2113''']
