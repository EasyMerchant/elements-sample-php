name: secret-scan

# LC-2113: fail PRs / pushes that introduce hard-coded credentials.
# Uses the gitleaks CLI directly (no licence key needed for org repos).
on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
      - name: Scan commits introduced by this change
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # Only new commits are scanned: the historical exposure is tracked in LC-2113
          # and is remediated by rotation, not by this check.
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            RANGE="--log-opts=${BASE_SHA}..${GITHUB_SHA}"
          else
            RANGE="--log-opts=-1"
          fi
          gitleaks git --redact --no-banner --exit-code 1 $RANGE --config .gitleaks.toml .
